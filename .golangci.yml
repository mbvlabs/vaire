version: "2"
formatters:
  enable:
    - gofmt
output:
  formats:
    format: colored-line-number
linters:
  default: standard
  enable:
    - bodyclose       # unclosed HTTP response bodies
    - contextcheck    # context.Context misuse
    - errname         # error type naming (ErrFoo)
    - errorlint       # unwrapped errors break errors.Is/As
    - exhaustive      # missing switch/map cases
    - whitespace
    - gocognit        # cognitive complexity
    - gosec           # security issues
    - wastedassign
    - dupl
    - nakedret
    - nestif          # deeply nested ifs
    - noctx           # HTTP requests without context
    - prealloc        # slice preallocation hints
    - unconvert       # unnecessary type conversions
    - nolintlint
    - unparam         # unused function parameters
    - gocyclo
    - unused
    - wsl_v5
  settings:
    gocognit:
      min-complexity: 20
    errcheck:
      check-type-assertions: true
  exclusions:
    presets:
      - comments
      - common-false-positives
    rules:
      - linters: [funlen, goconst, gosec, noctx]
        path: _test\.go

