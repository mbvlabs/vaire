name: Publish tagged release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-releases
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          route="$(bash scripts/tagged-release-route.sh "${version}")"
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${version%%.*}.x"
          case "${version}" in
            *-alpha.* | *-beta.*)
              git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/master
              ;;
          esac
          printf '%s\n' "${route}" >> "${GITHUB_OUTPUT}"
  psql:
    needs: route
    uses: ./.github/workflows/psql-candidates.yml
  publish:
    needs: [route, psql]
    runs-on: ubuntu-24.04
    environment: ${{ needs.route.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Validate release configuration
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "${RELEASE_BUCKET}" || { echo "RELEASE_BUCKET is not configured" >&2; exit 1; }
          test -n "${RELEASE_BASE_URL}" || { echo "RELEASE_BASE_URL is not configured" >&2; exit 1; }
          test -n "${R2_ENDPOINT}" || { echo "R2_ENDPOINT is not configured" >&2; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "R2_ACCESS_KEY_ID is not configured" >&2; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "R2_SECRET_ACCESS_KEY is not configured" >&2; exit 1; }
          grep -Fq "const ReleaseBaseURL = \"${RELEASE_BASE_URL}\"" internal/buildinfo/buildinfo.go || {
            echo "RELEASE_BASE_URL must equal buildinfo.ReleaseBaseURL" >&2
            exit 1
          }
      - name: Check release tooling
        run: |
          go vet ./...
          just lint
          go test ./internal/release/... ./internal/remote ./internal/upgrade
          bash tests/release-channels.sh
      - name: Download tested psql bundles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: psql-*
          path: dist/psql-artifacts
      - name: Check psql artifact boundaries
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            artifact="dist/psql-artifacts/psql-${platform/\//-}"
            test -f "${artifact}/psql.tar.gz"
            test -f "${artifact}/psql.tar.gz.sha256"
            test "$(find "${artifact}" -type f | wc -l)" -eq 2
            (cd "${artifact}" && sha256sum -c psql.tar.gz.sha256)
            mkdir -p "dist/psql-bundles/${platform}"
            cp "${artifact}/psql.tar.gz" "dist/psql-bundles/${platform}/psql.tar.gz"
          done
          test "$(find dist/psql-artifacts -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 4
      - name: Build the tagged release
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          CHANNEL: ${{ needs.route.outputs.channel }}
          PSQL_BUNDLE_DIR: dist/psql-bundles
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "${version}" "${CHANNEL}" "${RELEASE_BASE_URL}"
      - name: Sign and verify the tagged release
        env:
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: scripts/sign-release.sh "dist/release-${CHANNEL}"
      - name: Upload the immutable artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Match Edge: release files fit in a single PUT. Avoid R2 multipart
          # completion failures before publishing this immutable version.
          aws configure set default.s3.multipart_threshold 1GB
          existing="$(aws s3api list-objects-v2 \
            --bucket "${RELEASE_BUCKET}" --prefix "releases/${version}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "${R2_ENDPOINT}")"
          test "${existing}" = 0 || {
            echo "Release ${version} already exists and will not be overwritten" >&2
            exit 1
          }
          scripts/upload-release.sh "dist/release-${CHANNEL}" "${CHANNEL}" "${RELEASE_BUCKET}" "${R2_ENDPOINT}" artifacts
      - name: Promote the selected channel only forward
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch --tags origin
          promote="$(go run ./internal/release/cmd/promote --bucket "${RELEASE_BUCKET}" --key "${CHANNEL#stable-}/manifest.json" --endpoint "${R2_ENDPOINT}" "${version}")"
          if [ "${promote}" = yes ]; then
            scripts/upload-release.sh "dist/release-${CHANNEL}" "${CHANNEL}" "${RELEASE_BUCKET}" "${R2_ENDPOINT}" channel
          fi
      - name: Move the root channel when this is the highest version
        if: needs.route.outputs.environment == 'stable'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          promote="$(go run ./internal/release/cmd/promote --bucket "${RELEASE_BUCKET}" --key manifest.json --endpoint "${R2_ENDPOINT}" "${version}")"
          if [ "${promote}" != yes ]; then
            echo "the root channel stays unchanged: ${version} does not move it"
            exit 0
          fi
          release_root="dist/release-stable-${version%%.*}.x"
          cp "${release_root}/${version%%.*}.x/manifest.json" "${release_root}/manifest.json"
          cp "${release_root}/${version%%.*}.x/manifest.json.sigstore.json" "${release_root}/manifest.json.sigstore.json"
          scripts/upload-release.sh "${release_root}" stable "${RELEASE_BUCKET}" "${R2_ENDPOINT}" channel
