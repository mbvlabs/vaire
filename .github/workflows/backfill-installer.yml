name: Backfill versioned installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Full stable version without v (for example 1.0.0-alpha.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    environment: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Verify release and create missing installer
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backfill-installer.sh
