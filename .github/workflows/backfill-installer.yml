name: Backfill versioned installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Full tagged version without v (for example 1.0.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-releases
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/tagged-release-route.sh "${VERSION}" >> "${GITHUB_OUTPUT}"
  backfill:
    needs: route
    runs-on: ubuntu-24.04
    environment: ${{ needs.route.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Verify release and create missing installer
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backfill-installer.sh
